<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Studdle</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/images/studdleEngineLogo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>

  <!-- sistema que aplica filtros de daltonismo no sitem (garantindo que o usuário consiga visualizar nas imagens também, bem massa) -->
  <svg class="cb-filters" aria-hidden="true" focusable="false">
    <defs>
  
      <!-- PROTANOPIA — deficiência no cone L (vermelho) -->
      <filter id="cb-protanopia" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="
            1.0000   0.0000   0.0000  0  0
            -0.2549   1.2549   0.0000  0  0
            0.3031  -0.5451   1.2420  0  0
            0.0000   0.0000   0.0000  1  0" />
      </filter>
  
      <!-- DEUTERANOPIA — deficiência no cone M (verde) -->
      <filter id="cb-deuteranopia" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="
            1.0000   0.0000   0.0000  0  0
            -0.4375   1.4375   0.0000  0  0
            0.2625  -0.5625   1.3000  0  0
            0.0000   0.0000   0.0000  1  0" />
      </filter>
  
      <!-- TRITANOPIA — deficiência no cone S (azul) -->
      <filter id="cb-tritanopia" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="
            1.0500  -0.3825   0.3325  0  0
            0.0000   1.2345  -0.2345  0  0
            0.0000   0.0000   1.0000  0  0
            0.0000   0.0000   0.0000  1  0" />
      </filter>
  
      <!-- ACROMATOPSIA — sem percepção de cor -->
      <filter id="cb-acromatopsia" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="
            0.2126   0.7152   0.0722  0  0
            0.2126   0.7152   0.0722  0  0
            0.2126   0.7152   0.0722  0  0
            0.0000   0.0000   0.0000  1  0" />
        <feComponentTransfer>
          <feFuncR type="linear" slope="1.25" intercept="-0.125" />
          <feFuncG type="linear" slope="1.25" intercept="-0.125" />
          <feFuncB type="linear" slope="1.25" intercept="-0.125" />
        </feComponentTransfer>
      </filter>
  
    </defs>
  </svg>

</html>
