<section class="rank-mobile" aria-label="Progresso do aluno"
[style.--module-color]="moduleData.color">
  <div class="rank">
    <p>{{ moduleData.name }}</p>
    
    <img [src]="moduleData.image"
    [alt]="'Imagem ilustrativa do rank ' + moduleData.name"
    [class.loadingimage-rank]="!moduleData?.image"
    [class.image-loaded]="imageLoaded"
    (load)="imageLoaded = true"/>
  </div>

  <div class="linear-progress" aria-label="Progresso geral">
    <ion-progress-bar [value]="linearProgress / 100" />
    <span>{{ linearProgress }}% <ion-icon [icon]="personCircle" aria-hidden="true" /></span>
  </div>

  <div class="metrics">
    <article class="circle-progress" [style.--progress]="studyProgress + '%'" [ngClass]="studyTasksData.totalStudyContents ? '' : 'transparentProgress' ">
      <div class="circle-progress__content">
        <strong>{{ studyTasksData.studyCompleted }}/{{ studyTasksData.totalStudyContents }}</strong>
        <span>conteúdos a estudar</span>
      </div>
    </article>
    <article class="circle-progress" [style.--progress]="practiceProgress + '%'" [ngClass]="practiceTaskData.totalPracticeContents ? '' : 'transparentProgress' ">
      <div class="circle-progress__content">
        <strong>{{ practiceTaskData.practiceCompleted }}/{{ practiceTaskData.totalPracticeContents }}</strong>
        <span>conteúdos a praticar</span>
      </div>
    </article>
  </div>
</section>
