<article class="video-card"
[style.--thumbnail]="'url(' + video.thumbnail + ')'"
(click)="openVideo()">
    <img class="os-icon" [src]="video.thumbnail"
    [alt]="video.title" draggable="false">

    <h2>{{ video.title }}</h2>

    <div class="date-n-adm">
        <p class="video-date">
            {{ createdDateFormat }}
        </p>
        <!-- menu btn -->
        @if (userData?.privileges !== 0) {
            <button class="video-menu-btn" matButton
            [matMenuTriggerFor]="menu"
            (click)="$event.stopPropagation()">
                <mat-icon>
                    more_vert
                </mat-icon>
            </button>
        }
    </div>    
</article>

<!-- video adm menu -->
<mat-menu #menu="matMenu">
    <button class="menu-btns" mat-menu-item (click)="settingsSelect()">
        <span class="menubtn-underline"></span>
        <mat-icon>settings</mat-icon>
        <span>Configurações</span>
    </button>
    <button class="menu-btns" mat-menu-item (click)="deleteSelect()">
        <span class="menubtn-underline"></span>
        <mat-icon>delete</mat-icon>
        <span>Deletar</span>
    </button>
</mat-menu>
