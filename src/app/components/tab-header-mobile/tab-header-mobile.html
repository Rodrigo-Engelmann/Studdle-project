<!-- header -->
<ion-header>
    <ion-toolbar class="toolbar">
        @if (pagesConfig[selectedIndex].hasFilterOptions) {
            <div class="toolbar-content">
                <ion-button class="filter-btn"
                fill="clear" (click)="showFilterUpdate()">
                    <ion-icon name="filter-outline"></ion-icon>
                </ion-button>

                <span class="page-name">
                    {{pageName[selectedIndex]}}
                </span>

                <button class="profile-button" slot="end"
                type="button" aria-label="Abrir opções de usuário"
                [matBadge]="unreadCount || null" matBadgeSize="large"
                [matMenuTriggerFor]="menu">
                    <img class="profile-picture" draggable="false"
                    [src]="profile_picture || '../../../assets/images/profile-picture-placeholder.jpg'"
                    alt="imagem do usuário">
                </button>
            </div>
        } @else {
            <span class="page-name"
            slot="start" 
            [style.text-align]="'left'">
                {{pageName[selectedIndex]}}
            </span>

            <button class="profile-button" slot="end"
            type="button" aria-label="Abrir opções de usuário"
            [matBadge]="unreadCount || null" matBadgeSize="large"
            [matMenuTriggerFor]="menu">
                <img class="profile-picture" draggable="false"
                [src]="profile_picture || '../../../assets/images/profile-picture-placeholder.jpg'"
                alt="imagem do usuário">
            </button>
        }
    </ion-toolbar>

    <!-- filters subheader -->
    <ion-toolbar class="search-toolbar" [ngClass]="showFilters ? '' : 'hideFilters' ">
        <div class="search-container">
            <div class="search-bar">
                <ion-input
                class="search-input"
                placeholder="pesquisa"
                [(ngModel)]="searchQuery"
                (ngModelChange)="searchUpdate()">
                </ion-input>

                <button class="search-btn">
                    <ion-icon name="search-outline"></ion-icon>
                </button>
            </div>

            <div class="filters-container">
                <ion-select class="filter-select"
                interface="popover"
                placeholder="Módulo"
                [(ngModel)]="selectedModule"
                (ngModelChange)="searchUpdate()">
                    <ion-select-option
                    *ngFor="let modulo of modules"
                    [value]="modulo">
                        {{ modulo.name }}
                    </ion-select-option>
                </ion-select>

                <ion-select class="filter-select" [ngClass]="{ 'disabled-filter': categories.length <= 1 }"
                interface="popover"
                placeholder="Categoria"
                [(ngModel)]="selectedCategory"
                [disabled]="categories.length <= 1"
                (ngModelChange)="searchUpdate()">
                    <ion-select-option
                    *ngFor="let categoria of categories"
                    [value]="categoria.id">
                        {{ categoria.name }}
                    </ion-select-option>
                </ion-select>
            </div>
        </div>
    </ion-toolbar>
</ion-header>

<ion-content>
    <router-outlet></router-outlet>
</ion-content>

<!-- footer -->
<ion-footer>
    <nav class="bottom-nav">
        <ion-tab-button
        (click)="go(0)"
        [class.active]="selectedIndex === 0">
            <ion-icon name="home-outline"></ion-icon>
        </ion-tab-button>

        <ion-tab-button
        (click)="go(1)"
        [class.active]="selectedIndex === 1">
            <ion-icon name="play-circle-outline"></ion-icon>
        </ion-tab-button>

        <ion-tab-button
        (click)="go(2)"
        [class.active]="selectedIndex === 2">
            <ion-icon name="document-text-outline"></ion-icon>
        </ion-tab-button>

        <ion-tab-button
        (click)="go(3)"
        [class.active]="selectedIndex === 3">
            <ion-icon name="download-outline"></ion-icon>
        </ion-tab-button>

        <ion-tab-button
        (click)="go(4)"
        [class.tab-highlight]="progressPercentage >= 100 && selectedIndex !== 4"
        [class.active]="selectedIndex === 4">
            <ion-icon name="person-outline"></ion-icon>
        </ion-tab-button>
    </nav>
</ion-footer>

<mat-menu #menu="matMenu">
    <button mat-menu-item class="profile-dialogbtn" (click)="Configuracoes()">
        <ion-icon name="cog-outline"></ion-icon>
        <span>
            Configurações
        </span>
    </button>

    <button mat-menu-item class="profile-dialogbtn" (click)="openNotifications()">
        <span class="notification-badge"
        [matBadge]="unreadCount || null" matBadgeSize="small">
            <ion-icon class="notification-icon icon-btns" name="notifications-outline"></ion-icon>
        </span>
        <span>
            Notificações
        </span>
    </button>

    <button mat-menu-item class="profile-dialogbtn" (click)="Logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>
            Logout
        </span>
    </button>
</mat-menu>
