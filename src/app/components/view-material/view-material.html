<header class="side-padding">
    <img class="studdle-logo-header translateYhover" draggable="false"
    src="assets/images/studdleLogo-removed-background.png"
    alt="logo studdle - clique para voltar pro menu" (click)="goBack()">

    <img class="profile-picture translateYhover"
    [src]="profile_picture || '../../../assets/images/profile-picture-placeholder.jpg'"
    alt="imagem do usuário - clique para abrir as opções de usuário"
    matButton draggable="false" [matMenuTriggerFor]="menu">

    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="Configuracoes()">
        <mat-icon>settings</mat-icon>
        Configurações
      </button>
      <button mat-menu-item (click)="Logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </mat-menu>
</header>

<main>
    <div class="container-info">
        <img class="main-image" draggable="false"
        [src]="materialData.main_image ? 'http://localhost:3000'+materialData.main_image
                                       : 'assets/images/wide-placeholder.png'"
        [alt]="materialData.title">

        <h1> {{ materialData.title }} </h1>

        <div class="abstract">
            <p> {{ materialData.summary }} </p>
        </div>

        <div class="main-content-container">
            <div class="main-content" [innerHTML]="materialData.main_content"></div>
        </div>
    </div>

    <button class="comments-fab"
    mat-fab aria-label="Ver comentários"
    (click)="openComments()">
        <mat-icon>comment</mat-icon>
    </button>
</main>

@if (privilege !== 0) {
    <div class="material-settings"
    (click)="settingsSelect()">
        <mat-icon>
            settings
        </mat-icon>
    </div>
}
