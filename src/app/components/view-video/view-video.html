<main>
    <div class="container-info">
        @if (embedUrl) {
            <iframe class="video-player"
            [src]="embedUrl"
            width="560"
            height="315"
            frameborder="0"
            allowfullscreen
            ></iframe>
        } @else {
            <div class="video-player"></div>
        }

        <h1 class="title">
            {{ videoData.title }}
        </h1>

        @if (videoData.description.length) {
            <div class="description-container" #descriptionContainer>
                <p class="video-description"
                [class.expanded]="descriptionExpanded">
                    {{ videoData.description }}
                </p>

            </div>
            <button class="read-more"
            (click)="descriptionExpanded = !descriptionExpanded">
                {{ descriptionExpanded ? 'Mostrar menos' : 'Ler mais' }}
            </button>
        }

        @if (videoData.id !== -1) {
            <app-comments class="comments-container"
            [videoId]="videoData.id"
            ></app-comments>
        }
    </div>
</main>

@if (privilege !== 0) {
    <div class="video-settings"
    (click)="settingsSelect()">
        <mat-icon>
            settings
        </mat-icon>
    </div>
}

<div class="close-icon-container" (click)="goBack()">
    <mat-icon>
        close
    </mat-icon>
</div>
