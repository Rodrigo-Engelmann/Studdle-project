<header class="side-padding">
    <img class="studdle-logo-header translateYhover"
    src="assets/images/studdleLogo-removed-background.png"
    alt="logo studdle - clique para voltar pro menu" (click)="goBack()">

    <img class="profile-picture translateYhover"
    [src]="profile_picture || '../../../assets/images/profile-picture-placeholder.jpg'"
    alt="imagem do usuário - clique para abrir as opções de usuário"
    matButton [matMenuTriggerFor]="menu">
    
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="Configuracoes()">
        <mat-icon>settings</mat-icon>
        Configurações
      </button>
      <button mat-menu-item (click)="Logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </mat-menu>
</header>

<main>
    <div class="container-info">
        @if (embedUrl) {
            <iframe class="video-player"
            [src]="embedUrl"
            width="560"
            height="315"
            frameborder="0"
            allowfullscreen
            ></iframe>
        } @else {
            <div class="video-player"></div>
        }

        <h1 class="title">
            {{ videoData.title }}
        </h1>

        @if (videoData.description.length) {
            <div class="description-container" #descriptionContainer>
                <p class="video-description"
                [class.expanded]="descriptionExpanded">
                    {{ videoData.description }}
                </p>

            </div>
            <button class="read-more"
            (click)="descriptionExpanded = !descriptionExpanded">
                {{ descriptionExpanded ? 'Mostrar menos' : 'Ler mais' }}
            </button>
        }

        @if (videoData.id !== -1) {
            <app-comments class="comments-container"
            [videoId]="videoData.id"
            ></app-comments>
        }
    </div>
</main>

@if (privilege !== 0) {
    <div class="video-settings"
    (click)="settingsSelect()">
        <mat-icon>
            settings
        </mat-icon>
    </div>
}
