<header>
    <div class="main-header side-padding">
        <img class="studdle-logo-header translateYhover"
        src="assets/images/studdleLogo-removed-background.png"
        alt="logo studdle" draggable="false">

        <mat-tab-group
        [selectedIndex]="selectedIndex"
        (selectedIndexChange)="go($event)"
        animationDuration="400ms">
            <mat-tab label="Recomendações"></mat-tab>
            <mat-tab label="Vídeos"></mat-tab>
            <mat-tab label="Materiais"></mat-tab>
            <mat-tab label="Engine"></mat-tab>
            <mat-tab [labelClass]="progressPercentage >= 100 && selectedIndex !== 4 ? 'tab-highlight' : ''">
                <ng-template mat-tab-label>
                    <span>Progresso</span>
                    <span class="progress-percentage-text">
                        {{ progressPercentage ? progressPercentage : 0 }}%
                    </span>
                </ng-template>
            </mat-tab>
        </mat-tab-group>

        <div class="rightheader-content">
            @if (pagesConfig[selectedIndex].hasFilterOptions) {
                <mat-icon class="filter-icon icon-btns" (click)="showFilterUpdate()">filter_list</mat-icon>
            } @else {
                <div class="filter-icon"></div>
            }

            <span class="notification-badge icon-btns"
            [matBadge]="unreadCount || null" matBadgeSize="small"
            (click)="openNotifications()" class="notification-icon icon-btns">
                <mat-icon class="notification-icon">notifications_none</mat-icon>
            </span>
            
            <img class="profile-picture translateYhover"
            [src]="profile_picture || '../../../assets/images/profile-picture-placeholder.jpg'"
            alt="imagem do usuário - clique para abrir as opções de usuário"
            matButton [matMenuTriggerFor]="menu" draggable="false">
        </div>
        
        <mat-menu #menu="matMenu">
            <button mat-menu-item class="white-menucontent" (click)="Configuracoes()">
                <mat-icon class="white-menucontent">settings</mat-icon>
                Configurações
            </button>

            <button mat-menu-item class="white-menucontent" (click)="Logout()">
                <mat-icon class="white-menucontent">logout</mat-icon>
                Logout
            </button>
        </mat-menu>
    </div>

    <div class="search-header" [ngClass]="showFilters ? '' : 'hideFilters'">
        <form class="search-form side-padding">
            <mat-form-field appearance="outline" class="search-input search-header-input">
                <mat-label class="text-origin">Pesquisar</mat-label>

                <input class="writing-color"
                matInput
                placeholder="Busque algo..."
                [(ngModel)]="searchQuery"
                (ngModelChange)="searchUpdate()"
                name="search"
                aria-label="Pesquisar">

                <div class="search-icon-container" matSuffix (click)="searchUpdate()" aria-label="Buscar">
                    <mat-icon>search</mat-icon>
                </div>
            </mat-form-field>

            <div class="selectfilter-inputs">
                <mat-form-field appearance="outline" class="filter search-header-input">
                    <mat-label class="text-origin">Módulo</mat-label>

                    <mat-select
                    [(ngModel)]="selectedCategory"
                    (ngModelChange)="searchUpdate()"
                    name="category">
                        <mat-option *ngFor="let category of modules" [value]="category">
                            {{ category.name }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="filter search-header-input" [ngClass]="{ 'disabled-filter': categories.length <= 1 }">
                    <mat-label class="text-origin">Categoria</mat-label>

                    <mat-select
                    [(ngModel)]="selectedModule"
                    (ngModelChange)="searchUpdate()"
                    [disabled]="categories.length <= 1"
                    name="order">
                        @for (order of categories; track order.id) {
                            <mat-option [value]="order.id">
                                {{ order.name }}
                            </mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </div>
        </form>
    </div>
</header>

<div class="page-container">
    <router-outlet></router-outlet>
</div>
