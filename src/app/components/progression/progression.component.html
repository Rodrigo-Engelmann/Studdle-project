@if(isMobile) {
  <app-progression-mobile class="progression-components"
  [moduleData]="moduleData"
  [studyTasksData]="studyTasksData"
  [linearProgress]="mainProgress"
  ></app-progression-mobile>
} @else {
  <app-progression-desktop class="progression-components"
  [moduleData]="moduleData"
  [studyTasksData]="studyTasksData"
  [linearProgress]="mainProgress"
  ></app-progression-desktop>
}

<div class="add-btn"
(click)="openTaskManager()">
  <mat-icon> list_alt </mat-icon>
</div>
